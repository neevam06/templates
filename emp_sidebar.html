{% load static %}
<section class="section1">
    <div class="sidebar">
        <img src="{% static 'images/FullLogo.png' %}" alt="Logo" class="logo" height="100px" width="100px">
        <ul>
            <a href="{% url 'emp_page' %}">
                <li class="{% if request.path == '/emp_page/' %}active{% endif %}">
                    <i class="fas fa-th-large"></i> Events Overview
                </li>
            </a>

            <a href="{% url 'emp_events' %}">
                <li class="{% if 'emp_events' in request.path %}active{% endif %}">
                    <i class="fas fa-calendar-check"></i> Assigned Events
                </li>
            </a>
            
            <a href="{% url 'emp_leave_requests' %}">
                <li class="{% if 'emp_leave_requests' in request.path %}active{% endif %}">
                    <i class="fas fa-calendar-alt"></i> Leave Requests
                </li>
            </a>

            <a href="{% url 'emp_event_Vendors' %}">
                <li class="{% if 'emp_event_Vendors' in request.path %}active{% endif %}">
                    <i class="fas fa-sitemap"></i> Vendors
                </li>
            </a>

            <a href="{% url 'emp_event_view_vendor' %}">
                <li class="{% if 'emp_event_view_vendor' in request.path %}active{% endif %}">
                    <i class="fas fa-concierge-bell"></i> Assign Vendors
                </li>
            </a>

            <a href="{% url 'emp_event_srv_details' %}">
                <li class="{% if 'emp_event_srv_details' in request.path %}active{% endif %}">
                    <i class="fas fa-users-cog"></i> Assign Services
                </li>
            </a>

            <a href="{% url 'emp_event_summary' %}">
                <li class="{% if 'emp_event_summary' in request.path %}active{% endif %}">
                    <i class="fas fa-clipboard-list"></i> Event Summary
                </li>
            </a>
        </ul>

        <form action="{% url 'admin_logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn"><i class="fas fa-sign-out-alt"></i> Log Out</button>
        </form>
    </div>
</section>
