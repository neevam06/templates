{% extends 'emp_base.html' %}
{% load static %}
{% block content %}

<div class="form-container">
  <h2>Assign Department</h2>

  <form method="POST">
    {% csrf_token %}

    <!-- EVENT DROPDOWN -->
    <div class="mb-3">
      <label for="event_id">Select Event</label>
      <select name="event_id" id="event_id" class="form-control" required>
        <option value="">-- Select Event --</option>
        {% for event in events %}
          <option value="{{ event.event_id }}">
            {{ event.event_type.event_type }} - {{ event.vendor.vendor_name }}
          </option>
        {% endfor %}
      </select>
    </div>
{% if no_department_available %}
<div class="mb-3" style="
    padding: 14px;
    margin-bottom: 15px;
    background: #fff3cd;
    border-left: 5px solid #ffc107;
    color: #664d03;
    border-radius: 6px;
    font-weight: 500;
">
    ⚠️ No staff available for the selected event time.
</div>
{% endif %}
    <!-- MULTIPLE DEPARTMENT SELECTION -->
    <div class="mb-3">
      <label for="department_ids">
        Select Department(s)
        <small class="text-muted">(You can select multiple)</small>
      </label>

      <select
        name="department_ids[]"
        id="department_ids"
        class="form-control"
        multiple
        required
        size="6"
      >
        {% for dept in departments %}
          <option value="{{ dept.department_id }}">
            {{ dept.department_name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary">
      Next → Assign Service
    </button>
  </form>
</div>

{% endblock content %}
